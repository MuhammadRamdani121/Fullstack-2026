<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Html Forms & input</title>
  </head>
  <body>
    <form>
      <label for="">Nama Lengkap</label>
      <input type="text" />

      <button type="submit">kirim</button>
    </form>
    <hr />
    <h1>FORM</h1>
    <label for="text">Text</label>
    <input type="text" id="text" />
    <hr />
    <label for="email">email</label>
    <input type="email" id="email" />
    <hr />
    <label for="password">password</label>
    <input type="password" />
    <hr />
    <label for="number">Number</label>
    <input type="number" name="number" id="number" />
    <hr />
    <label for="date">Date</label>
    <input type="date" name="date" id="date" />
    <hr />
    <h1>Checkbox & Radio</h1>
    <h2>Checkbox</h2>
    <p>skill yang dikuasai:</p>
    <label for="">
      <input type="checkbox" name="skill" id="" value="html" />
      HTML
    </label>
    <label for="">
      <input type="checkbox" name="skill" id="" value="css" />
      CSS
    </label>

    <hr />
    <p>Jenis Kelamin:</p>
    <label for="">
      <input type="radio" name="gender" id="" value="laki-laki" />
      Laki-laki
    </label>

    <label for="">
      <input type="radio" name="gender" id="" value="perempuan" />
      perempuan
    </label>

    <hr />
    <label for="posisi">Posisi</label>

    <select name="posisi" id="posisi">
      <option value="frontend">Frontend Developer</option>
      <option value="backend">Backend Developer</option>
      <option value="fullstack">Full Stack Developer</option>
    </select>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Registration</title>
  </head>
  <body>
    <form action="">
      <h1>Developer Registration</h1>
      <p>Contoh tampilan dan field yang perlu dibuat</p>

      <label for="nama">Nama Lengkap</label>
      <input type="text" placeholder="Masukkan nama lengkap" />
      <label for="email">Email</label>
      <input type="email" placeholder="nama@email.com" />
      <label for="password">Password</label>
      <input type="password" placeholder="Masukkan Password" />
      <label for="posisi">posisi</label>
      <select name="posisi" id="">
        <option value="frontend">Frontend Developer</option>
        <option value="backend">Backend Developer</option>
        <option value="fullstack">Full Stack Developer</option>
      </select>

      <p>Skill yang dipelajari</p>
      <label for="">
        <input type="checkbox" name="skill" id="" />
        HTML
      </label>
      <label for="">
        <input type="checkbox" name="skill" id="" />
        CSS
      </label>
      <label for="">
        <input type="checkbox" name="skill" id="" />
        JavaScript
      </label>
      <label for="">
        <input type="checkbox" name="skill" id="" />
        React.js
      </label>

      <label for="">Deskripsi Diri</label>
      <textarea name="pesan" id="pesan"></textarea>
    </form>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menghubungkan CSS dengan HTML</title>
    <link rel="stylesheet" href="intro&syntax.css" />

    <style>
      .internal {
        color: blueviolet;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>Inline CSS</h2>
        <p style="color: red">Inline CSS = Dibagian Elemen HTML</p>
      </section>
      <section>
        <h2>Internal CSS</h2>
        <p class="internal">Internal CSS = Dibagian Head HTML</p>
      </section>
      <section>
        <h2>Inline CSS</h2>
        <p id="external">External CSS = Dibagian Luar HTML</p>
      </section>
    </main>
  </body>
</html>
